# Multi-tenant POS stack. Run from the server:
#   docker compose -f /data/pos/src/deploy/docker-compose.yml --env-file /data/pos/.env up -d --build
# Only the web port is published to the LAN; the API is bound to localhost for debugging and Postgres to localhost.
name: pos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pos
      TZ: Asia/Bangkok
    volumes:
      - ${PG_DATA:-/data/pos/pgdata}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      HTTP_ADDR: ":8090"
      DATABASE_URL: postgres://pos:${POSTGRES_PASSWORD}@postgres:5432/pos?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010}
      AUTO_MIGRATE: "true"
      AI_ENABLED: ${AI_ENABLED:-false}
      TLLM_BASE_URL: ${TLLM_BASE_URL:-http://192.168.1.116:9001}
      TLLM_ADMIN_TOKEN: ${TLLM_ADMIN_TOKEN:-}
      TLLM_MODEL: ${TLLM_MODEL:-T-LLM-GC}
      LINE_MOCK: ${LINE_MOCK:-true}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LIFF_ID: ${LIFF_ID:-}
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      TZ: Asia/Bangkok
    volumes:
      - ${LEGACY_DIR:-/data/pos/legacy}:/legacy
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8090"

  web:
    build:
      context: ../frontend
      args:
        BACKEND_INTERNAL_URL: http://api:8090
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
        NEXT_PUBLIC_LINE_MOCK: ${NEXT_PUBLIC_LINE_MOCK:-true}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND_INTERNAL_URL: http://api:8090
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Bangkok
    ports:
      - "${WEB_PORT:-3010}:3010"
